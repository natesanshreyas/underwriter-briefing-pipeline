# Scale the worker based on CPU — in production replace with KEDA
# scaling on Event Hubs consumer group lag for tighter feedback.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: email-ingestion-worker-hpa
  namespace: mail-ingestion
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: email-ingestion-worker
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
