apiVersion: apps/v1
kind: Deployment
metadata:
  name: email-ingestion-worker
  namespace: mail-ingestion
  labels:
    app: email-ingestion-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: email-ingestion-worker
  template:
    metadata:
      labels:
        app: email-ingestion-worker
    spec:
      containers:
        - name: email-ingestion-worker
          image: ACR_NAME.azurecr.io/email-ingestion-worker:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: mail-ingestion-config
          env:
            - name: GRAPH_TENANT_ID
              valueFrom:
                secretKeyRef:
                  name: mail-ingestion-secrets
                  key: GRAPH_TENANT_ID
            - name: GRAPH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: mail-ingestion-secrets
                  key: GRAPH_CLIENT_ID
            - name: GRAPH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: mail-ingestion-secrets
                  key: GRAPH_CLIENT_SECRET
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mail-ingestion-secrets
                  key: OPENAI_API_KEY
            - name: EVENTHUB_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: mail-ingestion-secrets
                  key: EVENTHUB_CONNECTION_STRING
            - name: STORAGE_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: mail-ingestion-secrets
                  key: STORAGE_CONNECTION_STRING
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: email-ingestion-worker
  namespace: mail-ingestion
spec:
  # ClusterIP only — Event Grid reaches this via the ingress below
  type: ClusterIP
  selector:
    app: email-ingestion-worker
  ports:
    - name: http
      port: 8081
      targetPort: 8081
